# Honnani GI — frontend + API + admin on one Render web service
databases:
  - name: honnani-db
    plan: free

services:
  - type: web
    name: honnani-gi
    runtime: node
    plan: free
    region: oregon
    branch: cursor/vercel-postgres-437b
    autoDeploy: true
    buildCommand: npm ci --include=dev && npx prisma generate && npx prisma migrate deploy && npx next build
    startCommand: npx next start --hostname 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22.14.0"
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: honnani-db
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: honnani-db
          property: connectionString
      - key: ADMIN_PASSWORD
        value: Demo@12345
      - key: ADMIN_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_CLINIC_NAME
        value: Honnani GI Surgery
      - key: NEXT_PUBLIC_DOCTOR_NAME
        value: Dr. Sharath S. Honnani
